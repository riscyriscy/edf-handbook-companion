# Arm the hardware watchdog from systemd, and bound a reboot that hangs.
# RuntimeWatchdogSec: systemd pings /dev/watchdog0 while it runs. If systemd or the kernel stops, the device resets.
# RebootWatchdogSec: the watchdog stays armed during shutdown, so a clean reboot that hangs still resets.
# The hardware may round a value to the closest timeout it supports.
[Manager]
RuntimeWatchdogSec=30s
RebootWatchdogSec=2min
